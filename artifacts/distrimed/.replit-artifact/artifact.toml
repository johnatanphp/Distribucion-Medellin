kind = "web"
previewPath = "/"
title = "DISTRIMED PWA"
version = "1.0.0"
id = "artifacts/distrimed"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18806

[services.development]
run = "PORT=18806 BASE_PATH=/ pnpm --filter @workspace/distrimed run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/distrimed", "run", "build" ]
publicDir = "artifacts/distrimed/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18806"
BASE_PATH = "/"
